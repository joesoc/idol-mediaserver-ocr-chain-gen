# ============================================================
#  NSW Driver's Licence — gen_chain.py definition
# ============================================================
# NOTE: This chain was hand-written before gen_chain.py existed.
# Running gen_chain.py with this file will SKIP cfg/XSL/test patching
# because Filter_NSW_DL already exists.  The YAML serves as the
# canonical record of the card geometry and ROI fractions.
#
# The hand-written Lua (compute_dynamic_region_nsw.lua) implements a
# two-pass OCR strategy with region expansion on the second pass —
# this is NOT auto-generated by the template.
# Do NOT overwrite it with --force.
# ============================================================

identifier: NSW_DL
description: "New South Wales Driver's Licence"

# ---------------------------------------------------------------------------
# card_estimation
#   The NSW_DL model detects a narrow banner at the right edge of the card.
#   The banner is ~85% of card height and only ~18% of card width.
#   Measured from NSW-DL.png.
# ---------------------------------------------------------------------------
card_estimation:
  left_offset_factor: -0.53   # expand left:  card_left  = min_x - lw * 0.53
  top_offset_factor:  -0.04   # expand top:   card_top   = min_y - lh * 0.04
  width_factor:        1.18   # card_width  = lw * 1.18
  height_factor:       4.3    # card_height = lh * 4.3  (banner ≈ 23% of card)

fields:
  - name: DL_Number
    description: "NSW licence number (bottom-left of card)"
    # Override: use hand-written two-pass Lua instead of auto-generated template.
    lua_script: compute_dynamic_region_nsw.lua
    roi:
      left:   0.01
      top:    0.78
      width:  0.33
      height: 0.11
    ocr:
      languages: en
      character_types: digit
      word_reject_threshold: 60
      ocr_mode: document

draw:
  roi_color:      [220, 200,   0]   # yellow
  boundary_color: [  0,   0, 160]   # dark blue
  label_fallback: NSW
